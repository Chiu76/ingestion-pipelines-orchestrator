[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ingestion-pipelines-orchestrator"
version = "1.0.0"
+dynamic = ["dependencies"]

[tool.setuptools.dynamic]
+dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["./app/"]